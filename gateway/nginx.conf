server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api/health { proxy_pass http://backend:3000/api/health; }
  location = /api/stats { proxy_pass http://backend:3000/api/stats; }

  location /api/auth/ { proxy_pass http://user:3000/api/auth/; }
  location /api/users/ { proxy_pass http://user:3000/api/users/; }
  location /api/addresses/ { proxy_pass http://user:3000/api/addresses/; }

  location /api/products { proxy_pass http://catalog:3000/api/products; }
  location /api/categories { proxy_pass http://catalog:3000/api/categories; }
  location /api/search { proxy_pass http://search:3000/api/search; }

  location /api/cart/ { proxy_pass http://cart:3000/api/cart/; }
  location /api/orders/ { proxy_pass http://order-service:3000/api/orders/; }
  location /api/payments/ { proxy_pass http://payment:3000/api/payments/; }
  location /api/shipping/ { proxy_pass http://shipping:3000/api/shipping/; }
  location /api/wishlist/ { proxy_pass http://wishlist:3000/api/wishlist/; }
  location /api/reviews/ { proxy_pass http://reviews:3000/api/reviews/; }
  location /api/discounts/ { proxy_pass http://discount:3000/api/discounts/; }
  location /api/notifications/ { proxy_pass http://notification:3000/api/notifications/; }

  location = /shop { return 301 /shop/; }
  location /shop/ { proxy_pass http://shop:80/; }
  location = /about { return 301 /about/; }
  location /about/ { proxy_pass http://about:80/; }
  location = /account { return 301 /account/; }
  location /account/ { proxy_pass http://account:80/; }
  location = /orders { return 301 /orders/; }
  location /orders/ { proxy_pass http://orders:80/; }
  location = /admin { return 301 /admin/; }
  location /admin/ { proxy_pass http://admin:80/; }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
  }
}
