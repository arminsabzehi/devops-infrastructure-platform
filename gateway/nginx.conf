server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://catalog:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /shop { return 301 /shop/; }
  location /shop/ { proxy_pass http://shop:80/; proxy_set_header Host $host; }
  location = /about { return 301 /about/; }
  location /about/ { proxy_pass http://about:80/; proxy_set_header Host $host; }
  location = /account { return 301 /account/; }
  location /account/ { proxy_pass http://account:80/; proxy_set_header Host $host; }
  location = /orders { return 301 /orders/; }
  location /orders/ { proxy_pass http://orders:80/; proxy_set_header Host $host; }
  location = /admin { return 301 /admin/; }
  location /admin/ { proxy_pass http://admin:80/; proxy_set_header Host $host; }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
