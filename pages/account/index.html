<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود و ثبت‌نام | دیجی‌نو</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f6f6;color:#222}.box{max-width:470px;margin:70px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 10px 35px #0001}h1{text-align:center;color:#ef4056}.tabs{display:flex;margin-bottom:20px}.tabs button{flex:1;padding:12px;border:0;background:#eee;cursor:pointer}.tabs button.on{background:#ef4056;color:white}.field{margin:10px 0}.field input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font:inherit}.primary{width:100%;padding:14px;background:#ef4056;color:#fff;border:0;border-radius:9px;font:inherit;cursor:pointer}.msg{margin:12px 0;padding:10px;border-radius:8px;background:#fff0f1;color:#b22}.ok{background:#eef8ed;color:#287a36}.links{text-align:center;margin-top:20px}.links a{margin:8px}.user{display:none;text-align:center}.logout{background:#222;color:#fff;border:0;padding:11px 25px;border-radius:8px}</style><main class="box"><h1>دیجی‌نو</h1><div id="auth"><div class="tabs"><button id="loginTab" class="on">ورود</button><button id="registerTab">ثبت‌نام</button></div><form id="form"><div id="nameField" class="field" hidden><input id="name" placeholder="نام و نام خانوادگی"></div><div class="field"><input id="identifier" placeholder="ایمیل یا شماره موبایل" required></div><div class="field"><input id="password" type="password" placeholder="رمز عبور" required></div><button class="primary">ادامه</button></form><div id="msg" class="msg" hidden></div></div><div id="user" class="user"><h2>خوش آمدی 👋</h2><p id="who"></p><button class="logout" id="logout">خروج از حساب</button></div><div class="links"><a href="/">خانه</a><a href="/checkout/">سبد خرید</a><a href="/orders/">سفارش‌ها</a></div></main><script>let mode='login';const $=id=>document.getElementById(id);function show(m){mode=m;$('loginTab').classList.toggle('on',m==='login');$('registerTab').classList.toggle('on',m==='register');$('nameField').hidden=m==='login';$('identifier').placeholder=m==='login'?'ایمیل یا شماره موبایل':'ایمیل';$('form').reset();$('msg').hidden=true}$('loginTab').onclick=()=>show('login');$('registerTab').onclick=()=>show('register');$('form').onsubmit=async e=>{e.preventDefault();const body=mode==='login'?{identifier:$('identifier').value,password:$('password').value}:{name:$('name').value,email:$('identifier').value,password:$('password').value};try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');if(mode==='register'){show('login');$('msg').textContent='ثبت‌نام انجام شد؛ حالا وارد شوید.';$('msg').hidden=false;$('msg').className='msg ok';return}localStorage.setItem('token',d.token);location.href='/checkout/'}catch(e){$('msg').textContent=e.message;$('msg').hidden=false}};async function me(){const t=localStorage.getItem('token');if(!t)return;try{const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw Error();const d=await r.json();$('auth').style.display='none';$('user').style.display='block';$('who').textContent=d.user.name+' — '+(d.user.email||d.user.phone)}catch{localStorage.removeItem('token')}}$('logout').onclick=async()=>{const t=localStorage.getItem('token');await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+t}});localStorage.removeItem('token');location.reload()};me()</script></html>
