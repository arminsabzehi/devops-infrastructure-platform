<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فروشگاه | دیجی‌نو</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f7f7;color:#202820}.shell{max-width:1240px;margin:auto;padding:0 20px}.top{background:#17201b;color:#fff;padding:22px 0}.toprow{display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:28px;font-weight:900;color:#d7e9a5}.back{color:#fff}.toolbar{background:#fff;border-bottom:1px solid #e4e4e4;padding:18px 0;position:sticky;top:0;z-index:5}.tools{display:flex;gap:12px;align-items:center}.search{flex:1;border:1px solid #ddd;border-radius:12px;padding:14px 16px;font-size:15px;outline:none}.select{border:1px solid #ddd;border-radius:12px;padding:13px;background:#fff}.cartbtn{border:0;background:#17201b;color:#fff;border-radius:10px;padding:12px 15px;cursor:pointer}.count{color:#687068;font-size:14px;white-space:nowrap}.content{padding:28px 20px 70px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px}.filters{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:20px;height:max-content;position:sticky;top:90px}.filters h3{margin-top:0}.cat{display:block;width:100%;text-align:right;background:none;border:0;padding:11px 8px;border-radius:8px;cursor:pointer;font-size:14px}.cat:hover,.cat.on{background:#eef4df;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;min-height:200px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;overflow:hidden;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px #00000012}.pic{height:210px;background:#f3f3f0;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;right:10px;top:10px;background:#d7e9a5;padding:6px 9px;border-radius:8px;font-size:11px}.body{padding:14px}.body small{color:#778078}.body h3{font-size:15px;line-height:1.7;min-height:52px;margin:7px 0}.stars{font-size:12px;color:#a17b00}.stars em{color:#888;font-style:normal}.price{display:flex;justify-content:space-between;align-items:end;margin-top:12px;gap:8px}.price strong{font-size:15px}.price del{font-size:11px;color:#999}.add{width:100%;margin-top:12px;border:0;background:#17201b;color:#fff;padding:10px;border-radius:8px;cursor:pointer}.box{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:55px;text-align:center;color:#687068}.error{background:#fff1f1;color:#a33;padding:18px;border-radius:12px;margin-bottom:18px}.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:30px;min-height:44px}.pager button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px 15px;cursor:pointer}.pager button.on{background:#17201b;color:#fff}.hint{margin-bottom:18px;color:#687068;font-size:14px}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:180px minmax(0,1fr)}}@media(max-width:700px){.layout{display:block}.filters{position:static;margin-bottom:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tools{flex-wrap:wrap}.search{min-width:100%}.pic{height:180px}}@media(max-width:430px){.grid{grid-template-columns:1fr}.pic{height:220px}}</style></head><body><header class="top"><div class="shell toprow"><a class="logo" href="/">دیجی‌نو</a><div>فروشگاه محصولات</div><a class="back" href="/">بازگشت به خانه ←</a></div></header><div class="toolbar"><div class="shell tools"><input id="search" class="search" placeholder="جستجو در محصولات..." autocomplete="off"><select id="sort" class="select"><option value="popular">محبوب‌ترین</option><option value="newest">جدیدترین</option><option value="price_asc">ارزان‌ترین</option><option value="price_desc">گران‌ترین</option></select><button class="cartbtn" onclick="location.href='/checkout/'">🛒 سبد خرید</button><span id="count" class="count"></span></div></div><main class="shell content"><div id="error" class="error" hidden></div><div class="layout"><aside class="filters"><h3>دسته‌بندی</h3><button class="cat on" data-cat="">همه محصولات</button><div id="cats"></div></aside><section><div class="hint">روی هر کالا بزن تا صفحه کامل محصول، مشخصات، فروشنده و نظرات را ببینی.</div><div id="grid" class="grid"></div><div id="status" class="box">در حال دریافت محصولات...</div><div id="pager" class="pager"></div></section></div></main><script>const token=localStorage.getItem('token');const state={page:1,limit:12,category:'',q:'',sort:'popular',total:0};const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' تومان';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function loadCats(){try{const r=await fetch('/api/categories');if(!r.ok)throw Error();const cs=await r.json();document.getElementById('cats').innerHTML=cs.map(c=>`<button class="cat" data-cat="${esc(c.name)}">${esc(c.name)}</button>`).join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;state.page=1;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x===b));load()})}catch(e){}}async function load(){const status=document.getElementById('status'),grid=document.getElementById('grid'),pager=document.getElementById('pager'),err=document.getElementById('error');status.textContent='در حال دریافت محصولات...';status.hidden=false;grid.innerHTML='';pager.innerHTML='';err.hidden=true;try{const p=new URLSearchParams({page:String(state.page),limit:String(state.limit),sort:state.sort});if(state.q)p.set('q',state.q);if(state.category)p.set('category',state.category);const r=await fetch('/api/products?'+p.toString());if(!r.ok)throw Error('کاتالوگ محصولات پاسخ نمی‌دهد');const d=await r.json();const items=d.items||[];state.total=Number(d.total||items.length);document.getElementById('count').textContent=`${new Intl.NumberFormat('fa-IR').format(state.total)} کالا`;grid.innerHTML=items.map(x=>`<article class="card"><a href="/product/?id=${x.id}" style="text-decoration:none;color:inherit"><div class="pic"><img loading="lazy" src="${esc(x.image)}" alt="${esc(x.name)}"><span class="badge">${esc(x.badge||'پیشنهاد ویژه')}</span></div><div class="body"><small>${esc(x.category)}</small><h3>${esc(x.name)}</h3><div class="stars">★ ${esc(x.rating||0)} <em>(${new Intl.NumberFormat('fa-IR').format(Number(x.review_count||0))})</em></div><div class="price"><strong>${money(x.price)}</strong>${x.old_price?`<del>${money(x.old_price)}</del>`:''}</div></div></a><div class="body" style="padding-top:0"><button class="add" onclick="event.stopPropagation();addToCart(${x.id})">افزودن به سبد</button></div></article>`).join('');status.hidden=items.length>0;if(!items.length){status.textContent='محصولی در این صفحه پیدا نشد';status.hidden=false}const pages=Math.max(1,Math.ceil(state.total/state.limit));for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-state.page)<=1){const b=document.createElement('button');b.textContent=new Intl.NumberFormat('fa-IR').format(i);b.className=i===state.page?'on':'';b.onclick=()=>{state.page=i;load();window.scrollTo({top:0,behavior:'smooth'})};pager.appendChild(b)}else if((i===2&&state.page>3)||(i===pages-1&&state.page<pages-2)){const s=document.createElement('span');s.className='dots';s.textContent='…';pager.appendChild(s)}}}catch(e){status.hidden=true;err.textContent=e.message;err.hidden=false}}async function addToCart(id){if(!token){if(confirm('برای افزودن به سبد باید وارد حساب شوید. وارد حساب کاربری می‌شوید؟'))location.href='/account/';return}try{const r=await fetch('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({product_id:id,quantity:1})});const d=await r.json();if(!r.ok)throw Error(d.error||'افزودن به سبد ناموفق بود');location.href='/checkout/'}catch(e){alert(e.message)}}let timer;document.getElementById('search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.q=e.target.value.trim();state.page=1;load()},350)};document.getElementById('sort').onchange=e=>{state.sort=e.target.value;state.page=1;load()};loadCats();load();</script></body></html>
