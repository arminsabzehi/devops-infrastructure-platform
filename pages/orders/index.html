<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سفارش‌های من | دیجی‌نو</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f6f6;color:#222}.wrap{max-width:1050px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.logo{font-size:27px;font-weight:900;color:#ef4056;text-decoration:none}.box,.order{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;margin-bottom:14px}.order{display:grid;grid-template-columns:1fr auto;gap:10px}.status{padding:6px 10px;border-radius:7px;background:#fff3d8;color:#8a6100;font-size:12px}.total{font-weight:900}.btn{display:inline-block;background:#ef4056;color:#fff;padding:10px 15px;border-radius:8px;text-decoration:none}.empty{text-align:center;padding:70px;color:#777}.msg{background:#fff0f1;color:#b22;padding:14px;border-radius:9px;margin-bottom:15px;white-space:pre-wrap}@media(max-width:600px){.order{grid-template-columns:1fr}}</style><div class="wrap"><div class="head"><a class="logo" href="/">دیجی‌نو</a><a href="/checkout/">سبد خرید</a></div><div id="msg" class="msg" hidden></div><div id="content" class="box">در حال دریافت سفارش‌ها...</div></div><script>const token=localStorage.getItem('token');const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' تومان';const status=s=>({pending:'در انتظار پرداخت',paid:'پرداخت شده',cod_pending:'در انتظار پرداخت هنگام تحویل',processing:'در حال پردازش',shipped:'ارسال شده',delivered:'تحویل شده',cancelled:'لغو شده'}[s]||s||'در انتظار پرداخت');const showError=t=>{const e=document.getElementById('msg');e.textContent=t;e.hidden=false};async function getOrders(){const urls=['/api/orders/','/api/orders'];let last='';for(const url of urls){try{const r=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'},cache:'no-store'});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(r.ok){if(!Array.isArray(d))throw Error('پاسخ سرویس سفارش معتبر نیست');return d}last=`${url} → HTTP ${r.status}${d.error?' — '+d.error:''}`;if(r.status!==404)break}catch(e){last=`${url} → ${e.message||e}`} }throw Error(last||'ارتباط با سرویس سفارش برقرار نشد')}async function load(){if(!token){document.getElementById('content').innerHTML='<div class="empty">برای مشاهده سفارش‌ها وارد حساب شوید.<br><br><a class="btn" href="/account/">ورود / ثبت‌نام</a></div>';return}try{const d=await getOrders();document.getElementById('content').innerHTML=d.length?d.map(o=>`<div class="order"><div><b>سفارش #${o.id}</b><p><span class="status">${status(o.status)}</span></p><small>${new Date(o.created_at).toLocaleString('fa-IR')}</small></div><div><div class="total">${money(o.total)}</div><br><a class="btn" href="/orders/?id=${o.id}">مشاهده</a></div></div>`).join(''):'<div class="empty">هنوز سفارشی ثبت نکرده‌اید.<br><br><a class="btn" href="/shop/">شروع خرید</a></div>'}catch(e){document.getElementById('content').innerHTML='<div class="empty">دریافت سفارش‌ها ناموفق بود.</div>';showError(e.message)}}load()</script></html>
