<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جزئیات محصول | دیجی‌نو</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f6f6f6;color:#202820}.shell{max-width:1240px;margin:auto;padding:0 20px}.top{background:#17201b;color:#fff;padding:18px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:27px;font-weight:900;color:#d7e9a5;text-decoration:none}.nav a{color:#fff;text-decoration:none}.crumb{padding:18px 0;color:#727a73;font-size:13px}.card{background:#fff;border:1px solid #e4e4e4;border-radius:18px}.hero{display:grid;grid-template-columns:45% 55%;overflow:hidden}.gallery{padding:24px;border-left:1px solid #eee}.mainpic{height:430px;background:#f5f5f2;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}.mainpic img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:10px;margin-top:12px;overflow:auto}.thumb{width:72px;height:72px;flex:0 0 72px;border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fafafa;cursor:pointer}.thumb.on{border:2px solid #17201b}.thumb img{width:100%;height:100%;object-fit:cover}.info{padding:30px}.cat{color:#777;font-size:13px}.title{font-size:27px;line-height:1.8;margin:8px 0}.rating{color:#a17b00;margin:8px 0}.rating span{color:#777;font-size:13px}.summary{color:#4f5750;line-height:2;margin:18px 0}.pricebox{background:#f8faf5;border-radius:14px;padding:18px;margin:18px 0}.price{font-size:26px;font-weight:900}.old{color:#999;text-decoration:line-through;margin-right:12px;font-size:14px}.offer{border:1px solid #ddd;border-radius:13px;padding:15px;margin:12px 0}.offer.buy{border:2px solid #17201b}.seller{display:flex;justify-content:space-between;gap:10px}.meta{color:#6e766f;font-size:12px;margin-top:8px}.buyrow{display:flex;gap:10px;margin-top:18px}.buy{flex:1;border:0;border-radius:11px;padding:14px;background:#17201b;color:#fff;font-size:16px;cursor:pointer}.wish{border:1px solid #bbb;background:#fff;border-radius:11px;padding:0 18px;font-size:22px;cursor:pointer}.tabs{margin-top:22px}.tabsbar{display:flex;gap:6px;border-bottom:1px solid #ddd;overflow:auto}.tab{border:0;background:none;padding:17px 20px;cursor:pointer;white-space:nowrap;font-size:14px}.tab.on{font-weight:800;border-bottom:3px solid #17201b}.panel{padding:26px}.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.spec{display:grid;grid-template-columns:38% 62%;background:#fafafa;border-radius:9px;padding:11px}.spec b{font-size:13px;color:#666}.spec span{font-size:13px;line-height:1.8}.review{border-bottom:1px solid #eee;padding:18px 0}.review:last-child{border-bottom:0}.rhead{display:flex;justify-content:space-between}.verified{font-size:11px;color:#42724b}.proscons{font-size:12px;line-height:2;color:#59605a}.qa{padding:17px 0;border-bottom:1px solid #eee}.qa b{display:block;margin-bottom:8px}.qa div{color:#59605a;line-height:1.9}.related{margin-top:22px;padding:25px}.relgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.rel{border:1px solid #e4e4e4;border-radius:12px;overflow:hidden;text-decoration:none;color:#222;background:#fff}.rel img{width:100%;height:150px;object-fit:cover}.rel div{padding:10px;font-size:13px;line-height:1.7}.error{padding:30px;background:#fff0f0;color:#a33;border-radius:14px;margin-top:25px}@media(max-width:900px){.hero{grid-template-columns:1fr}.gallery{border-left:0;border-bottom:1px solid #eee}.mainpic{height:340px}.specgrid{grid-template-columns:1fr}.relgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.title{font-size:21px}.mainpic{height:280px}.info{padding:20px}.relgrid{grid-template-columns:1fr 1fr}.nav div{display:none}}</style></head><body><header class="top"><div class="shell nav"><a class="logo" href="/">دیجی‌نو</a><div>صفحه محصول</div><a href="/shop/">← فروشگاه</a></div></header><main class="shell"><div id="crumb" class="crumb">فروشگاه / محصول</div><div id="error" class="error" hidden></div><section id="hero" class="card hero" hidden><div class="gallery"><div class="mainpic"><img id="mainimg"></div><div id="thumbs" class="thumbs"></div></div><div class="info"><div id="cat" class="cat"></div><h1 id="title" class="title"></h1><div id="rating" class="rating"></div><p id="summary" class="summary"></p><div class="pricebox"><span id="price" class="price"></span><span id="old" class="old"></span><div id="stock" class="meta"></div></div><div id="offers"></div><div class="buyrow"><button id="add" class="buy">🛒 افزودن به سبد خرید</button><button id="wish" class="wish" title="علاقه‌مندی">♡</button></div></div></section><section id="tabs" class="card tabs" hidden><div class="tabsbar"><button class="tab on" data-tab="spec">مشخصات فنی</button><button class="tab" data-tab="desc">معرفی محصول</button><button class="tab" data-tab="reviews">نظرات کاربران</button><button class="tab" data-tab="qa">پرسش و پاسخ</button></div><div id="panel" class="panel"></div></section><section id="related" class="card related" hidden><h2>محصولات مرتبط</h2><div id="relgrid" class="relgrid"></div></section></main><script>const id=new URLSearchParams(location.search).get('id');const token=localStorage.getItem('token');let product=null;const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' تومان';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function showErr(x){const e=document.getElementById('error');e.textContent=x;e.hidden=false}async function load(){if(!id)return showErr('شناسه محصول مشخص نشده است.');try{const r=await fetch('/api/products/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'محصول پیدا نشد');product=d;document.title=d.name+' | دیجی‌نو';document.getElementById('crumb').textContent='فروشگاه / '+d.category+' / '+d.name;document.getElementById('cat').textContent=d.category;document.getElementById('title').textContent=d.name;document.getElementById('rating').innerHTML='★ '+esc(d.rating)+' <span>از ۵ · '+new Intl.NumberFormat('fa-IR').format(Number(d.review_count||0))+' نظر</span>';document.getElementById('summary').textContent=d.description;document.getElementById('price').textContent=money(d.price);document.getElementById('old').textContent=d.old_price?money(d.old_price):'';document.getElementById('stock').textContent=d.stock>0?'موجود در انبار · '+new Intl.NumberFormat('fa-IR').format(d.stock)+' عدد':'ناموجود';renderGallery(d.images?.length?d.images:[{url:d.image}]);renderOffers(d.offers||[]);renderTab('spec');document.getElementById('hero').hidden=false;document.getElementById('tabs').hidden=false;loadRelated();}catch(e){showErr(e.message)}}function renderGallery(xs){const main=document.getElementById('mainimg'),th=document.getElementById('thumbs');const a=xs.filter(x=>x.url);main.src=a[0]?.url||'';th.innerHTML=a.map((x,i)=>`<button class="thumb ${i===0?'on':''}" onclick="pick(${i})"><img src="${esc(x.url)}"></button>`).join('');window.gallery=a}function pick(i){document.getElementById('mainimg').src=window.gallery[i].url;document.querySelectorAll('.thumb').forEach((x,j)=>x.classList.toggle('on',i===j))}function renderOffers(xs){const box=document.getElementById('offers');box.innerHTML=xs.slice(0,4).map((x,i)=>`<div class="offer ${i===0?'buy':''}"><div class="seller"><b>${esc(x.seller_name)}</b><span>★ ${esc(x.seller_rating)}</span></div><div class="price">${money(x.price)}</div><div class="meta">ارسال: ${esc(x.shipping_days)} روز · موجودی: ${esc(x.stock)} · ${x.is_buy_box?'پیشنهاد منتخب':''}</div></div>`).join('')}function renderTab(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));const p=document.getElementById('panel');if(tab==='spec'){const s=product.specifications||[];p.innerHTML='<h2>مشخصات فنی</h2><div class="specgrid">'+s.map(x=>`<div class="spec"><b>${esc(x.spec_key)}</b><span>${esc(x.spec_value)}</span></div>`).join('')+'</div>'}else if(tab==='desc'){p.innerHTML=`<h2>معرفی محصول</h2><p style="line-height:2.2">${esc(product.description)}</p><h3>ویژگی‌های خرید</h3><p style="line-height:2">کالا نو است، توسط فروشنده عرضه می‌شود و جزئیات گارانتی و ارسال در پیشنهاد فروشنده نمایش داده می‌شود.</p>`}else if(tab==='reviews'){const rs=product.reviews||[];p.innerHTML='<h2>نظرات کاربران</h2>'+(!rs.length?'<p>هنوز نظری ثبت نشده است.</p>':rs.map(r=>`<article class="review"><div class="rhead"><b>${esc(r.user_name)} · ★ ${r.rating}</b>${r.verified?'<span class="verified">خرید تأییدشده</span>':''}</div><h3>${esc(r.title)}</h3><p>${esc(r.body)}</p><div class="proscons">${r.pros?.length?'نکات مثبت: '+esc(r.pros.join('، ')):''}${r.cons?.length?'<br>نکات منفی: '+esc(r.cons.join('، ')):''}<br>مفید بود برای ${new Intl.NumberFormat('fa-IR').format(r.helpful_count)} نفر</div></article>`).join('')}')}else{const qs=product.questions||[];p.innerHTML='<h2>پرسش و پاسخ</h2>'+(!qs.length?'<p>پرسشی ثبت نشده است.</p>':qs.map(q=>`<article class="qa"><b>❓ ${esc(q.question)}</b><div>${q.answer?'پاسخ: '+esc(q.answer):'هنوز پاسخی ثبت نشده است.'}</div></article>`).join(''))}}async function loadRelated(){const r=await fetch('/api/products?category='+encodeURIComponent(product.category)+'&limit=8&sort=popular');if(!r.ok)return;const d=await r.json();const xs=(d.items||[]).filter(x=>x.id!==product.id).slice(0,4);document.getElementById('relgrid').innerHTML=xs.map(x=>`<a class="rel" href="/product/?id=${x.id}"><img src="${esc(x.image)}"><div>${esc(x.name)}<br><b>${money(x.price)}</b></div></a>`).join('');document.getElementById('related').hidden=!xs.length}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>renderTab(b.dataset.tab));document.getElementById('add').onclick=async()=>{if(!token){if(confirm('برای افزودن به سبد باید وارد حساب شوید.'))location.href='/account/';return}const r=await fetch('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({product_id:product.id,quantity:1})});const d=await r.json();if(!r.ok)return alert(d.error||'خطا');location.href='/checkout/'};document.getElementById('wish').onclick=()=>{const key='wish:'+product.id;localStorage.setItem(key,'1');document.getElementById('wish').textContent='♥'};load()</script></body></html>
