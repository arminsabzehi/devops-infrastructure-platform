<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محصول | دیجی‌نو</title><style>body{margin:0;background:#f5f5f5;font-family:Tahoma,Arial;color:#222}.wrap{max-width:1200px;margin:auto;padding:20px}.top{background:#17201b;color:white;padding:18px}.top a{color:white}.card{background:white;border:1px solid #ddd;border-radius:16px;padding:22px;margin-bottom:20px}.product{display:grid;grid-template-columns:42% 58%;gap:25px}.photo{height:420px;background:#fafafa;border-radius:14px;display:flex;align-items:center;justify-content:center}.photo img{max-width:100%;max-height:100%;object-fit:contain}.thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}.thumb{width:65px;height:65px;padding:0;border:1px solid #ddd;background:white;border-radius:8px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.title{font-size:27px;line-height:1.8}.rating{color:#a17700}.price{font-size:27px;font-weight:bold}.old{text-decoration:line-through;color:#999;margin-right:12px}.seller{border:1px solid #ddd;border-radius:12px;padding:13px;margin:10px 0}.seller.best{border:2px solid #17201b}.btn{width:100%;padding:15px;border:0;border-radius:10px;background:#17201b;color:#fff;font-size:16px;cursor:pointer}.wish{width:auto;margin-top:8px;background:white;color:#222;border:1px solid #aaa}.tabs{display:flex;gap:5px;border-bottom:1px solid #ddd;overflow:auto}.tab{padding:15px 20px;border:0;background:white;cursor:pointer}.tab.on{font-weight:bold;border-bottom:3px solid #17201b}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.spec{background:#fafafa;padding:12px;border-radius:8px}.review,.qa{padding:15px 0;border-bottom:1px solid #eee}.related{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.rel{border:1px solid #ddd;border-radius:10px;padding:10px;text-decoration:none;color:#222}.rel img{width:100%;height:150px;object-fit:contain}.error{background:#fff0f0;color:#a00;padding:20px;border-radius:10px}.loading{padding:30px;text-align:center}@media(max-width:800px){.product{grid-template-columns:1fr}.specs{grid-template-columns:1fr}.related{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap"><b>دیجی‌نو</b>　<a href="/shop/">فروشگاه</a></div></header><main class="wrap"><div id="crumb">فروشگاه / محصول</div><div id="msg" class="loading">در حال بارگذاری محصول...</div><section id="product" class="card product" style="display:none"><div><div class="photo"><img id="main" alt="محصول"></div><div id="thumbs" class="thumbs"></div></div><div><div id="cat"></div><h1 id="name" class="title"></h1><div id="rating" class="rating"></div><p id="desc"></p><div><span id="price" class="price"></span><span id="old" class="old"></span></div><div id="stock"></div><div id="sellers"></div><button id="add" class="btn">🛒 افزودن به سبد خرید</button><button id="wish" class="btn wish">♡ افزودن به علاقه‌مندی</button></div></section><section id="details" class="card" style="display:none"><div class="tabs"><button class="tab on" data-t="spec">مشخصات فنی</button><button class="tab" data-t="desc">معرفی محصول</button><button class="tab" data-t="review">نظرات کاربران</button><button class="tab" data-t="qa">پرسش و پاسخ</button></div><div id="panel"></div></section><section id="relatedBox" class="card" style="display:none"><h2>محصولات مرتبط</h2><div id="related" class="related"></div></section></main><script>
(function(){'use strict';const id=new URLSearchParams(location.search).get('id'),token=localStorage.getItem('token');let p=null,imgs=[];const $=x=>document.getElementById(x),num=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0)),money=n=>num(n)+' تومان',esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){const r=await fetch(u,o),t=await r.text();let d;try{d=JSON.parse(t)}catch(e){throw Error('پاسخ API نامعتبر است')}if(!r.ok)throw Error(d.error||'خطا');return d}function gallery(){const a=imgs.filter(x=>x&&x.url);$('main').src=a[0]?a[0].url:p.image||'';$('thumbs').innerHTML=a.map((x,i)=>'<button class="thumb" data-i="'+i+'"><img src="'+esc(x.url)+'"></button>').join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{$('main').src=a[Number(b.dataset.i)].url})}function sellers(){const a=p.offers||[];$('sellers').innerHTML=a.slice(0,5).map((x,i)=>'<div class="seller '+(!i?'best':'')+'"><b>'+esc(x.seller_name||'فروشنده')+'</b> ★ '+esc(x.seller_rating||'-')+'<div class="price">'+money(x.price)+'</div><small>ارسال '+esc(x.shipping_days||'-')+' روز · موجودی '+esc(x.stock||0)+(x.is_buy_box?' · پیشنهاد منتخب':'')+'</small></div>').join('')}function tab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));let h='';if(t==='spec'){const a=p.specifications||[];h='<h2>مشخصات فنی</h2><div class="specs">'+(a.length?a.map(x=>'<div class="spec"><b>'+esc(x.spec_key)+'</b><br>'+esc(x.spec_value)+'</div>').join(''):'<p>مشخصات فنی ثبت نشده است.</p>')+'</div>'}else if(t==='desc'){h='<h2>معرفی محصول</h2><p style="line-height:2.2">'+esc(p.description||'')+'</p>'}else if(t==='review'){const a=p.reviews||[];h='<h2>نظرات کاربران</h2>'+(a.length?a.map(x=>'<div class="review"><b>'+esc(x.user_name)+' · ★ '+esc(x.rating)+'</b><h3>'+esc(x.title)+'</h3><p>'+esc(x.body)+'</p></div>').join(''):'<p>هنوز نظری ثبت نشده است.</p>')}else{const a=p.questions||[];h='<h2>پرسش و پاسخ</h2>'+(a.length?a.map(x=>'<div class="qa"><b>❓ '+esc(x.question)+'</b><p>'+esc(x.answer||'هنوز پاسخی ثبت نشده است.')+'</p></div>').join(''):'<p>پرسشی ثبت نشده است.</p>')}$('panel').innerHTML=h}async function related(){try{const d=await api('/api/products?category='+encodeURIComponent(p.category||'')+'&limit=8&sort=popular'),a=(d.items||[]).filter(x=>Number(x.id)!==Number(p.id)).slice(0,4);$('related').innerHTML=a.map(x=>'<a class="rel" href="/product/?id='+x.id+'"><img src="'+esc(x.image)+'"><div>'+esc(x.name)+'</div><b>'+money(x.price)+'</b></a>').join('');$('relatedBox').style.display=a.length?'block':'none'}catch(e){}}async function load(){if(!id){$('msg').className='error';$('msg').textContent='شناسه محصول مشخص نشده است.';return}try{p=await api('/api/products/'+encodeURIComponent(id));document.title=p.name+' | دیجی‌نو';$('crumb').textContent='فروشگاه / '+(p.category||'محصول')+' / '+p.name;$('cat').textContent=p.category||'';$('name').textContent=p.name||'';$('rating').innerHTML='★ '+esc(p.rating||'-')+'　<span style="color:#777">'+num(p.review_count)+' نظر</span>';$('desc').textContent=p.description||'';$('price').textContent=money(p.price);$('old').textContent=p.old_price?money(p.old_price):'';$('stock').textContent=Number(p.stock)>0?'موجود در انبار · '+num(p.stock)+' عدد':'ناموجود';imgs=p.images||[];gallery();sellers();tab('spec');$('msg').style.display='none';$('product').style.display='grid';$('details').style.display='block';related()}catch(e){$('msg').className='error';$('msg').textContent=e.message}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));$('add').onclick=async()=>{if(!p)return;if(!token){location.href='/account/';return}try{const d=await api('/api/cart/items',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({product_id:p.id,quantity:1})});location.href='/checkout/'}catch(e){alert(e.message)}};$('wish').onclick=()=>{if(p)localStorage.setItem('wish:'+p.id,'1');$('wish').textContent='♥ در علاقه‌مندی‌ها'};load()})();
</script></body></html>
