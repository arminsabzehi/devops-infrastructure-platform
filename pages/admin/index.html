<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت | نو مارکت</title>
<style>
body{font-family:Arial,sans-serif;background:#111b17;margin:0;color:#fff}main{max-width:1200px;margin:30px auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.muted{color:#b8c8c1}button{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:#fff;color:#173b2a;font-weight:bold}input,textarea{width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #456054;background:#16251f;color:#fff;margin:5px 0 12px}textarea{min-height:90px}label{display:block;color:#c9d6d0;font-size:14px}.login,.panel{background:#1d3028;border-radius:18px;padding:22px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:20px}.card{background:#182720;border:1px solid #30483e;border-radius:15px;padding:14px}.card img{width:100%;height:180px;object-fit:contain;background:#0f1714;border-radius:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}.error{color:#ff9b9b;margin-top:8px}.ok{color:#9ee7b7;margin-top:8px}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:20px}.modal>div{background:#1d3028;border-radius:18px;padding:24px;width:min(620px,100%);max-height:90vh;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><h1>پنل مدیریت نو مارکت</h1><p class="muted">مدیریت واقعی کالا و تصویر؛ بدون تغییر Docker یا Git برای محتوای فروشگاه.</p></div><button onclick="location.href='/'">بازگشت به سایت</button></div>
<section id="login" class="login"><h2>ورود مدیر</h2><label>کلید مدیریت</label><input id="token" type="password" placeholder="Admin token"><button onclick="login()">ورود</button><div id="loginMsg"></div></section>
<section id="app" class="panel hidden"><div class="top"><h2>کالاها</h2><button onclick="loadProducts()">بروزرسانی</button></div><div id="msg"></div><div id="products" class="grid"></div></section>
</main>
<div id="modal" class="modal hidden"><div><div class="top"><h2 id="modalTitle">ویرایش کالا</h2><button onclick="closeModal()">بستن</button></div><form id="form" onsubmit="saveProduct(event)"><input type="hidden" id="id"><div class="row"><div><label>نام</label><input id="name" required></div><div><label>Slug</label><input id="slug" required></div></div><div class="row"><div><label>دسته‌بندی</label><input id="category" required></div><div><label>قیمت</label><input id="price" type="number" min="0" required></div></div><div class="row"><div><label>قیمت قبلی</label><input id="old_price" type="number" min="0"></div><div><label>موجودی</label><input id="stock" type="number" min="0"></div></div><div><label>نشان</label><input id="badge"></div><div><label>توضیحات</label><textarea id="description"></textarea></div><label>تصویر اصلی جدید</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="actions"><button type="submit">ذخیره تغییرات</button><button type="button" onclick="uploadImage()">آپلود تصویر</button><button type="button" onclick="deleteImage()">حذف تصویر</button></div><div id="formMsg"></div></form></div></div>
<script>
let adminToken=sessionStorage.getItem('novamarket-admin-token')||'';let current=null;
const $=id=>document.getElementById(id);
async function api(path,options={}){options.headers={...(options.headers||{}),'x-admin-token':adminToken};const r=await fetch('/api/admin'+path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
async function login(){adminToken=$('token').value.trim();try{await api('/products');sessionStorage.setItem('novamarket-admin-token',adminToken);$('login').classList.add('hidden');$('app').classList.remove('hidden');loadProducts()}catch(e){$('loginMsg').className='error';$('loginMsg').textContent=e.message}}
async function loadProducts(){try{const items=await api('/products');$('products').innerHTML=items.map(p=>`<article class="card"><img src="${p.image||''}" alt=""><h3>${escapeHtml(p.name)}</h3><p class="muted">#${p.id} · ${escapeHtml(p.category)} · ${Number(p.price).toLocaleString('fa-IR')} تومان</p><p>موجودی: ${p.stock}</p><div class="actions"><button onclick='edit(${JSON.stringify(p).replaceAll("'","&#39;")})'>ویرایش</button></div></article>`).join('');$('msg').textContent=`${items.length} کالا`;$('msg').className='ok'}catch(e){$('msg').className='error';$('msg').textContent=e.message}}
function edit(p){current=p;$('id').value=p.id;$('name').value=p.name;$('slug').value=p.slug;$('category').value=p.category;$('price').value=p.price;$('old_price').value=p.old_price??'';$('stock').value=p.stock;$('badge').value=p.badge||'';$('description').value=p.description||'';$('image').value='';$('formMsg').textContent='';$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
async function saveProduct(e){e.preventDefault();try{await api('/products/'+$('id').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,slug:$('slug').value,category:$('category').value,price:$('price').value,old_price:$('old_price').value||null,stock:$('stock').value,badge:$('badge').value,description:$('description').value})});$('formMsg').className='ok';$('formMsg').textContent='اطلاعات ذخیره شد';loadProducts()}catch(e){$('formMsg').className='error';$('formMsg').textContent=e.message}}
async function uploadImage(){const f=$('image').files[0];if(!f)return $('formMsg').textContent='ابتدا یک تصویر انتخاب کنید';const fd=new FormData();fd.append('image',f);try{await api('/products/'+$('id').value+'/image',{method:'POST',body:fd});$('formMsg').className='ok';$('formMsg').textContent='تصویر با موفقیت در MinIO ذخیره شد و محصول بروزرسانی شد';$('image').value='';loadProducts()}catch(e){$('formMsg').className='error';$('formMsg').textContent=e.message}}
async function deleteImage(){if(!confirm('تصویر اصلی حذف شود؟'))return;try{await api('/products/'+$('id').value+'/image',{method:'DELETE'});$('formMsg').className='ok';$('formMsg').textContent='تصویر حذف شد';loadProducts()}catch(e){$('formMsg').className='error';$('formMsg').textContent=e.message}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(adminToken){$('token').value=adminToken;login()}
</script></body></html>
