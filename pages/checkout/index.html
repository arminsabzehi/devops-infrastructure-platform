<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سبد خرید و پرداخت | دیجی‌نو</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f6f6f6;color:#222}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-size:27px;font-weight:900;color:#ef4056;text-decoration:none}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}.box{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;margin-bottom:16px}.box h2{font-size:18px;margin-top:0}.item{display:flex;gap:15px;align-items:center;border-bottom:1px solid #eee;padding:14px 0}.item:last-child{border:0}.item img{width:90px;height:90px;object-fit:contain;background:#f5f5f5;border-radius:10px}.item h3{font-size:14px;margin:0 0 8px}.grow{flex:1}.qty{display:flex;align-items:center;gap:8px}.qty button{border:1px solid #ddd;background:#fff;border-radius:7px;width:30px;height:30px}.price{font-weight:700}.summary div{display:flex;justify-content:space-between;margin:14px 0}.total{font-size:20px;font-weight:900;border-top:1px solid #eee;padding-top:15px}.primary{width:100%;border:0;background:#ef4056;color:#fff;padding:15px;border-radius:9px;font-weight:700;cursor:pointer;font-size:15px}.primary:disabled{opacity:.5}.address input,.address textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font:inherit}.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay label{border:1px solid #ddd;padding:15px;border-radius:10px;cursor:pointer}.msg{padding:12px;border-radius:9px;background:#fff0f1;color:#c33;margin-bottom:15px}.success{background:#eef8ed;color:#287a36}.empty{text-align:center;padding:60px;color:#777}@media(max-width:750px){.grid{grid-template-columns:1fr}.item{align-items:flex-start}.item img{width:70px;height:70px}}</style><body><div class="wrap"><div class="head"><a class="logo" href="/">دیجی‌نو</a><a href="/shop/">ادامه خرید ←</a></div><div id="msg" class="msg" hidden></div><div class="grid"><section><div class="box"><h2>🛒 سبد خرید</h2><div id="cart">در حال دریافت...</div></div><div class="box"><h2>📍 آدرس تحویل</h2><div id="address" class="address"></div></div><div class="box"><h2>🚚 روش ارسال</h2><label><input type="radio" name="ship" value="normal" checked> ارسال عادی — ۳ تا ۵ روز کاری</label><br><label><input type="radio" name="ship" value="express"> ارسال سریع — ۱ تا ۲ روز کاری (۱۵۰,۰۰۰ تومان)</label></div><div class="box"><h2>💳 روش پرداخت</h2><div class="pay"><label><input type="radio" name="pay" value="online" checked> پرداخت آنلاین</label><label><input type="radio" name="pay" value="cod"> پرداخت هنگام تحویل</label></div></div></section><aside><div class="box summary"><h2>خلاصه سفارش</h2><div><span>مبلغ کالاها</span><strong id="subtotal">۰</strong></div><div><span>هزینه ارسال</span><strong id="shipping">رایگان</strong></div><div class="total"><span>مبلغ قابل پرداخت</span><strong id="total">۰</strong></div><button id="checkout" class="primary">ثبت سفارش و پرداخت</button></div></aside></div></div><script>const token=localStorage.getItem('token');let cart={items:[],total:0},address=null;const money=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0))+' تومان';const msg=(t,ok=false)=>{const e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'success':'');e.hidden=false};async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطا در ارتباط با سرویس');return d}function render(){const el=document.getElementById('cart');if(!cart.items.length){el.innerHTML='<div class="empty">سبد خرید شما خالی است.<br><a href="/shop/">رفتن به فروشگاه</a></div>';document.getElementById('checkout').disabled=true;return}document.getElementById('checkout').disabled=false;el.innerHTML=cart.items.map(i=>`<div class="item"><img src="${i.image||''}" alt=""><div class="grow"><h3>${i.name}</h3><div class="price">${money(i.price)}</div></div><div class="qty"><button onclick="change(${i.id},${i.quantity-1})">−</button><b>${i.quantity}</b><button onclick="change(${i.id},${i.quantity+1})">+</button></div></div>`).join('');const express=document.querySelector('input[name=ship]:checked').value==='express';document.getElementById('subtotal').textContent=money(cart.total);document.getElementById('shipping').textContent=express?'۱۵۰,۰۰۰ تومان':'رایگان';document.getElementById('total').textContent=money(cart.total+(express?150000:0))}async function change(id,q){try{if(q<1)await api('/api/cart/items/'+id,{method:'DELETE'});else await api('/api/cart/items/'+id,{method:'PATCH',body:JSON.stringify({quantity:q})});await load()}catch(e){msg(e.message)}}async function load(){if(!token){msg('برای خرید ابتدا وارد حساب کاربری شوید.');document.getElementById('cart').innerHTML='<div class="empty"><a href="/account/">ورود / ثبت‌نام</a></div>';return}try{cart=await api('/api/cart/');const addresses=await api('/api/addresses/');address=addresses[0]||null;document.getElementById('address').innerHTML=address?`<strong>${address.title}</strong><p>${address.city} — ${address.address}<br>کدپستی: ${address.postal_code||'ثبت نشده'}</p>`:'<p>هنوز آدرسی ثبت نشده.</p><input id="at" placeholder="عنوان آدرس"><input id="city" placeholder="شهر"><textarea id="addr" placeholder="آدرس کامل"></textarea><input id="postal" placeholder="کد پستی"><button class="primary" onclick="saveAddress()">ثبت آدرس</button>';render()}catch(e){msg(e.message)}}async function saveAddress(){try{address=await api('/api/addresses/',{method:'POST',body:JSON.stringify({title:document.getElementById('at').value,city:document.getElementById('city').value,address:document.getElementById('addr').value,postal_code:document.getElementById('postal').value})});load()}catch(e){msg(e.message)}}document.querySelectorAll('input[name=ship]').forEach(x=>x.onchange=render);document.getElementById('checkout').onclick=async()=>{try{if(!address)return msg('ابتدا آدرس تحویل را ثبت کنید.');const order=await api('/api/orders/',{method:'POST'});const method=document.querySelector('input[name=pay]:checked').value;const payment=await api('/api/payments/',{method:'POST',body:JSON.stringify({order_id:order.id,method})});if(payment.status==='paid'){msg('سفارش با موفقیت ثبت و پرداخت شد. شماره سفارش: '+order.id,true);setTimeout(()=>location.href='/orders/',1200)}else msg('سفارش ثبت شد و در انتظار پرداخت است. شماره سفارش: '+order.id,true)}catch(e){msg(e.message)}};load();</script></body></html>
